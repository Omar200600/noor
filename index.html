<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>النظام الميداني الشامل للمفقودات والاتجاهات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050b14;
            color: #00f0ff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #ar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .header {
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-box h1 {
            font-size: 14px;
            color: #fff;
        }

        .title-box span {
            font-size: 10px;
            color: #00ff88;
        }

        .status-badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #ff0055;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badge.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            color: #00ff88;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        .crosshair-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            pointer-events: none;
        }

        .crosshair-ring {
            width: 100%;
            height: 100%;
            border: 1px dashed rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            position: relative;
        }

        .crosshair-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: #00f0ff;
            border-radius: 50%;
        }

        .control-panel {
            background: rgba(5, 11, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 55vh;
            overflow-y: auto;
        }

        .input-group {
            display: flex;
            gap: 6px;
        }

        input, select, textarea {
            flex: 1;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 6px 8px;
            color: #fff;
            font-size: 11px;
            outline: none;
        }

        textarea {
            resize: none;
            height: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 7px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .telemetry {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 6px;
        }

        .tele-box {
            text-align: center;
        }

        .tele-label {
            font-size: 8px;
            color: #88a0b0;
        }

        .tele-val {
            font-size: 11px;
            font-weight: bold;
            color: #fff;
        }

        .permission-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 11, 20, 0.95);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            gap: 15px;
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <div class="ui-layer">
        <div class="header interactive">
            <div class="title-box">
                <h1>النظام الميداني الشامل</h1>
                <span>مفقودات، مواشي، قبلة، اتجاهات</span>
            </div>
            <div id="status-badge" class="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">في انتظار GPS</span>
            </div>
        </div>

        <button id="audio-toggle" class="audio-btn interactive" style="position: absolute; top: 75px; left: 15px; background: rgba(5,11,20,0.8); border:1px solid #00f0ff; color:#00f0ff; border-radius:50%; width:35px; height:35px; cursor:pointer;">🔊</button>

        <div class="crosshair-container">
            <div class="crosshair-ring"></div>
            <div class="crosshair-center"></div>
        </div>

        <div class="control-panel interactive">
            <div class="telemetry">
                <div class="tele-box">
                    <div class="tele-label">المسافة الحقيقية</div>
                    <div class="tele-val" id="val-distance">-- م</div>
                </div>
                <div class="tele-box">
                    <div class="tele-label">اتجاه الهدف</div>
                    <div class="tele-val" id="val-bearing">--°</div>
                </div>
                <div class="tele-box">
                    <div class="tele-label">بوصلة الجهاز</div>
                    <div class="tele-val" id="val-heading">--°</div>
                </div>
            </div>

            <!-- قائمة اختيار الفئة أو الهدف -->
            <div class="input-group">
                <select id="target-category">
                    <option value="custom">-- اختر تصنيف الهدف --</option>
                    <option value="qibla">🕋 اتجاه القبلة (مكة المكرمة)</option>
                    <option value="livestock">🐑 مواشي ضائعة (أغنام / إبل)</option>
                    <option value="documents">📁 أوراق أو كيس نقود مفقود</option>
                    <option value="person">👤 شخص / طفل مفقود</option>
                    <option value="school">🏫 مدرسة أو معهد</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" id="target-name" placeholder="اسم الهدف (مثلاً: قطيع أغنام / كيس وثائق)">
            </div>
            
            <div class="input-group">
                <textarea id="target-desc" placeholder="وصف تفصيلي بالعربية (اللون، العلامات)..."></textarea>
            </div>

            <!-- إرفاق صورة الهدف -->
            <div class="input-group">
                <label class="btn" style="background: rgba(0, 240, 255, 0.15); border: 1px solid #00f0ff; color: #00f0ff; flex: 1; font-size: 10px; cursor: pointer; padding: 6px;">
                    📷 إرفاق صورة الهدف <input type="file" id="target-img-file" accept="image/*" style="display: none;">
                </label>
            </div>

            <div class="input-group">
                <button id="btn-get-current" class="btn" style="background: rgba(0, 255, 136, 0.2); border: 1px solid #00ff88; color: #00ff88; flex: 1;">📍 حفظ موقعي الحالي كهدف</button>
            </div>

            <div class="input-group">
                <input type="number" id="target-lat" step="any" placeholder="خط العرض (Lat)">
                <input type="number" id="target-lng" step="any" placeholder="خط الطول (Lng)">
            </div>

            <div class="input-group">
                <button id="btn-start" class="btn" style="flex: 2;">🎯 بدء التوجيه الميداني</button>
                <button id="btn-clear" class="btn" style="flex: 1; background: #ff0055; color:#fff;">إعادة ضبط</button>
            </div>
        </div>
    </div>

    <div id="start-overlay" class="permission-overlay">
        <div style="font-size: 45px;">🧭</div>
        <h2 style="color:#fff;">النظام الميداني الشامل</h2>
        <p style="color:#88a0b0; font-size: 12px;">يتطلب النظام إذن الكاميرا والموقع الجغرافي (GPS) لخدمة تتبع المفقودات وتحديد الاتجاهات والقبلة.</p>
        <button id="btn-init-system" class="btn" style="padding: 12px 25px; font-size: 14px;">تشغيل الكاميرا والمستشعرات</button>
    </div>

    <script>
        let userLocation = null;
        let targetLocation = null;
        let deviceHeading = 0;
        let targetBearing = 0;
        let distanceToTarget = 0;
        let voiceEnabled = true;
        let lastVoiceTime = 0;
        let targetImageObj = null;

        const videoElem = document.getElementById('camera-feed');
        const canvasElem = document.getElementById('ar-canvas');
        const ctx = canvasElem.getContext('2d');
        const overlay = document.getElementById('start-overlay');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');

        const valDistance = document.getElementById('val-distance');
        const valBearing = document.getElementById('val-bearing');
        const valHeading = document.getElementById('val-heading');
        const categorySelect = document.getElementById('target-category');

        function resizeCanvas() {
            canvasElem.width = window.innerWidth;
            canvasElem.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.getElementById('btn-init-system').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoElem.srcObject = stream;
                overlay.style.display = 'none';
                initGPS();
                initOrientation();
                speak("تم تفعيل النظام الميداني بنجاح.");
            } catch (err) {
                alert("تعذر تشغيل الكاميرا: " + err.message);
            }
        });

        function initGPS() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        statusBadge.classList.add('active');
                        statusText.textContent = "GPS متصل بحرية";
                        updateNavigation();
                    },
                    (err) => {
                        statusBadge.classList.remove('active');
                        statusText.textContent = "فشل GPS";
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            }
        }

        // التعامل مع القائمة المنسدلة للخيارات السريعة (مثل القبلة)
        categorySelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'qibla') {
                document.getElementById('target-name').value = "اتجاه القبلة";
                document.getElementById('target-desc').value = "الكعبة المشرفة - مكة المكرمة";
                // إحداثيات الكعبة المشرفة الثابتة
                targetLocation = { lat: 21.4225, lng: 39.8262 };
                updateNavigation();
                speak("تم تحديد اتجاه القبلة بنجاح.");
            }
        });

        // رفع صورة الهدف
        document.getElementById('target-img-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    targetImageObj = new Image();
                    targetImageObj.src = event.target.result;
                    alert("تم إرفاق صورة الهدف بنجاح.");
                };
                reader.readAsDataURL(file);
            }
        });

        // حفظ الموقع الحالي كهدف
        document.getElementById('btn-get-current').addEventListener('click', () => {
            if (userLocation) {
                document.getElementById('target-lat').value = userLocation.lat;
                document.getElementById('target-lng').value = userLocation.lng;
                targetLocation = { lat: userLocation.lat, lng: userLocation.lng };
                speak("تم حفظ موقعك الحالي كهدف.");
            } else {
                alert("جاري التقاط إشارة الـ GPS...");
            }
        });

        function initOrientation() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
        }

        function handleOrientation(event) {
            if (event.webkitCompassHeading) {
                deviceHeading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                deviceHeading = 360 - event.alpha;
            }
            valHeading.textContent = Math.round(deviceHeading) + '°';
            updateNavigation();
        }

        function calculateHaversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function updateNavigation() {
            if (!userLocation || !targetLocation) return;
            distanceToTarget = calculateHaversine(userLocation.lat, userLocation.lng, targetLocation.lat, targetLocation.lng);
            targetBearing = calculateBearing(userLocation.lat, userLocation.lng, targetLocation.lat, targetLocation.lng);

            valDistance.textContent = distanceToTarget < 1000 
                ? Math.round(distanceToTarget) + ' م' 
                : (distanceToTarget / 1000).toFixed(2) + ' كم';

            valBearing.textContent = Math.round(targetBearing) + '°';

            const now = Date.now();
            if (voiceEnabled && now - lastVoiceTime > 8000) {
                speak(`المسافة المتبقية ${Math.round(distanceToTarget)} متراً`);
                lastVoiceTime = now;
            }
        }

        function renderAROverlay() {
            ctx.clearRect(0, 0, canvasElem.width, canvasElem.height);
            if (targetLocation && userLocation) {
                const centerX = canvasElem.width / 2;
                const centerY = canvasElem.height / 2;
                const diffAngle = (targetBearing - deviceHeading + 360) % 360;
                const normalizedAngle = diffAngle > 180 ? diffAngle - 360 : diffAngle;
                const fov = 60;
                const screenX = centerX + (normalizedAngle / (fov / 2)) * (canvasElem.width / 2);

                ctx.save();
                if (Math.abs(normalizedAngle) < fov) {
                    ctx.beginPath();
                    ctx.arc(screenX, centerY - 40, 18, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(0, 255, 136, 0.4)";
                    ctx.fill();
                    ctx.strokeStyle = "#00ff88";
                    ctx.stroke();

                    // عرض صورة الهدف المصغرة إذا تم إرفاقها
                    if (targetImageObj) {
                        ctx.drawImage(targetImageObj, screenX - 12, centerY - 52, 24, 24);
                    }

                    ctx.fillStyle = "rgba(5, 11, 20, 0.9)";
                    ctx.fillRect(screenX - 60, centerY + 5, 120, 32);
                    ctx.strokeStyle = "#00ff88";
                    ctx.strokeRect(screenX - 60, centerY + 5, 120, 32);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 10px Segoe UI";
                    ctx.textAlign = "center";
                    ctx.fillText(document.getElementById('target-name').value || "📍 هدف ميداني", screenX, centerY + 18);
                    ctx.fillText(distanceToTarget < 1000 ? `${Math.round(distanceToTarget)} متر` : `${(distanceToTarget/1000).toFixed(2)} كم`, screenX, centerY + 30);
                }
                ctx.restore();
            }
            requestAnimationFrame(renderAROverlay);
        }
        requestAnimationFrame(renderAROverlay);

        document.getElementById('btn-start').addEventListener('click', () => {
            const name = document.getElementById('target-name').value;
            const lat = parseFloat(document.getElementById('target-lat').value);
            const lng = parseFloat(document.getElementById('target-lng').value);

            if (!name) {
                alert("يرجى كتابة اسم الهدف.");
                return;
            }
            if (lat && lng) {
                targetLocation = { lat, lng };
            }

            if (!targetLocation) {
                alert("يرجى إحديد الإحداثيات أو اختيار اتجاه القبلة أو حفظ الموقع الحالي.");
                return;
            }

            updateNavigation();
            speak("تم بدء التوجيه الميداني بنجاح.");
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            targetLocation = null;
            targetImageObj = null;
            document.getElementById('target-name').value = '';
            document.getElementById('target-desc').value = '';
            document.getElementById('target-lat').value = '';
            document.getElementById('target-lng').value = '';
            categorySelect.value = 'custom';
            valDistance.textContent = '-- م';
            valBearing.textContent = '--°';
            speak("تمت إعادة الضبط.");
        });

        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            window.speechSynthesis.speak(utterance);
        }

        document.getElementById('audio-toggle').addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            document.getElementById('audio-toggle').textContent = voiceEnabled ? "🔊" : "🔇";
        });
    </script>
</body>
</html>
